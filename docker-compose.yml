version: "3.8"

services:
  # Definiert die Python-Anwendung, die Logs erzeugt.
  python-app:
    build:
      context: ./python-app
      dockerfile: Dockerfile
    container_name: python-app
    ports:
      - "5002:5002"
    volumes:
      - ./logs:/app/logs/
    networks:
      - monitoring-net

  # Definiert Grafana und konfiguriert beim Start automatisch Loki als Datenquelle.
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
        - name: Loki
          type: loki
          access: proxy
          orgId: 1
          url: 'http://loki:3100'
          basicAuth: false
          isDefault: true
          version: 1
          editable: true
        EOF
        /run.sh
    networks:
      - monitoring-net

  # Definiert Loki, den Dienst zum Speichern der Logs.
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - monitoring-net

  # Definiert Alloy, den Agenten zum Sammeln und Weiterleiten der Logs an Loki.
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    ports:
      - "12345:12345"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy
      # die API-Schnittstelle zum Docker-Daemon, der alle deine Container verwaltet.
      # Damit sieht alloy alle anderen Container und kann Logs abgreifen
      - /var/run/docker.sock:/var/run/docker.sock
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      - python-app
      - loki
    networks:
      - monitoring-net

# Definiert das gemeinsame virtuelle Netzwerk für alle Dienste.
networks:
  monitoring-net:
    driver: bridge

# Definiert das benannte Volume für die dauerhafte Speicherung von Grafana-Daten.
volumes:
  grafana-data:
