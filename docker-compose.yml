version: "3.8"

services:
  # Definiert die Python-Anwendung, die Logs erzeugt.
  python-app:
    build:
      context: ./python-app
      dockerfile: Dockerfile
    container_name: python-app
    ports:
      - "5002:5002"
    volumes:
      - ./logs:/app/logs/
    environment:
      - OTEL_SERVICE_NAME=python-app
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true # wichtig für auto inst und ersetzt LoggingInstrumentor
      - OTEL_TRACES_EXPORTER=console # todo: brauche ich noch für zero code und verhindert, dass nach otlp gesucht wird
      - OTEL_LOGS_EXPORTER=console
      - OTEL_METRICS_EXPORTER=console
      - OTEL_PYTHON_LOG_CORRELATION=true
    networks:
      - monitoring-net

  # Definiert Grafana und konfiguriert beim Start automatisch Loki als Datenquelle.
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - tempo
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
        # Loki Konfiguration
        - name: Loki
          type: loki
          access: proxy
          url: 'http://loki:3100'
          isDefault: true
        # Tempo Konfiguration
        - name: Tempo
          type: tempo
          access: proxy
          url: 'http://tempo:3200'
          # Verknüpfung von Tempo zu Loki, um von Traces zu Logs zu springen
          tracesToLogs:
            datasourceUid: 'Loki' # Name der Loki-Datenquelle
            tags: ['job', 'instance', 'pod', 'namespace', 'service_name']
            mappedTags: [{ key: 'service.name', value: 'service' }]
            filterByTraceID: true
        EOF
        /run.sh
    networks:
      - monitoring-net

  # Definiert Loki, den Dienst zum Speichern der Logs.
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - monitoring-net

  # Definiert Tempo, den Dienst zum Speichern der Traces.
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: [ "-config.file=/etc/tempo-config.yaml" ]
    volumes:
      - ./tempo-config.yaml:/etc/tempo-config.yaml
    ports:
      - "3200:3200"
    networks:
      - monitoring-net

  # Definiert Alloy, den Agenten zum Sammeln und Weiterleiten der Logs und Traces an Loki.
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    ports:
      - "12345:12345"
      - "4318:4318" # Port für den OTLP-Receiver öffnen
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy
      # die API-Schnittstelle zum Docker-Daemon, der alle deine Container verwaltet.
      # Damit sieht alloy alle anderen Container und kann Logs abgreifen
      - /var/run/docker.sock:/var/run/docker.sock
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      - python-app
      - loki
      - tempo
    networks:
      - monitoring-net

# Definiert das gemeinsame virtuelle Netzwerk für alle Dienste.
networks:
  monitoring-net:
    driver: bridge

# Definiert das benannte Volume für die dauerhafte Speicherung von Grafana-Daten.
volumes:
  grafana-data:
